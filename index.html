// ── CASES ────────────────────────────────────────────────────────────
function renderCases(){
  var fl=["all","洽談","報價","簽約","收訂金","施工","驗收","收尾款","結案"];
  var tabs=fl.map(function(f){
    var cnt=f==="all"?CASES.length:CASES.filter(function(c){return c.status===f;}).length;
    var lbl=f==="all"?"全部 ("+cnt+")":f+(cnt?" ("+cnt+")":"");
    return "<div class='filter-tab"+(FILTER===f?" active":"")+"' data-filter="+f+">"+lbl+"</div>";
  }).join("");

  var filtered=FILTER==="all"?CASES:CASES.filter(function(c){return c.status===FILTER;});
  var items=filtered.map(function(c){
    return "<div class='case-card"+(SEL===c.id?" selected":"")+"' data-case="+c.id+">"
      +"<div class=case-num>"+c.id+"</div>"
      +"<div class=case-info><div class=case-name>"+c.client+"</div>"
      +"<div class=case-sub>"+c.type+" · "+c.contact+"</div>"
      +sbar(c.statusIdx)+"</div>"
      +"<div class=case-right><div>"+badge(c.status)+"</div>"
      +"<div class=case-amt style=margin-top:5px>"+fmt(c.amount)+"</div>"
      +"<div class=case-date>"+fmtD(c.start)+"</div></div></div>";
  }).join("");
  if(!items)items="<div style=padding:40px;text-align:center;color:#94a3b8>此狀態無案件</div>";

  var detail=SEL?renderDetail(CASES.find(function(c){return c.id===SEL;})):"";

  document.getElementById("content").innerHTML=
    "<div class=section-hd style=margin-bottom:12px><span class=section-title>業務案件</span>"
    +"<button class=btn-primary>＋ 新增案件</button></div>"
    +"<div class=filter-tabs>"+tabs+"</div>"
    +"<div class=card style=overflow:visible><div class=case-list>"+items+"</div></div>"
    +detail;

  if(SEL){var el=document.querySelector(".detail-panel");if(el)setTimeout(function(){el.scrollIntoView({behavior:"smooth",block:"nearest"});},50);}
}

function renderDetail(c){
  if(!c)return "";
  var tl=STAGES.map(function(s,i){
    var dc=i<c.statusIdx?"done":i===c.statusIdx?"current":"";
    var ln=i<7?"<div class='stage-line"+(i<c.statusIdx?" done":"")+"'></div>":"";
    return "<div class=stage-step><div class=stage-step-line>"
      +"<div class='stage-circle "+dc+"'>"+(i<c.statusIdx?"✓":(i+1))+"</div>"
      +ln+"</div><div class='stage-lbl "+dc+"'>"+s+"</div></div>";
  }).join("");

  return "<div class=detail-panel>"
    +"<div class=detail-header>"
    +"<div><div class=detail-title>"+c.client+"</div><div class=detail-id>"+c.id+" · "+c.type+"</div></div>"
    +"<div style=display:flex;gap:8px;align-items:center>"+badge(c.status)
    +"<button class=close-btn data-close-detail=1>✕</button></div></div>"
    +"<div class=stage-timeline>"+tl+"</div>"
    +"<div class=detail-grid>"
    +"<div class=info-item><label>聯絡人</label><span>"+c.contact+"</span></div>"
    +"<div class=info-item><label>電話</label><span>"+c.phone+"</span></div>"
    +"<div class=info-item><label>地址</label><span>"+c.address+"</span></div>"
    +"<div class=info-item><label>施工期間</label><span>"+fmtD(c.start)+" — "+fmtD(c.end)+"</span></div>"
    +"</div>"
    +"<div class=payment-row>"
    +"<div class='pay-box "+(c.depositPaid?"paid":"pending")+"'><div class=pay-label>訂金 (30%)</div><div class=pay-amount>"+fmt(c.deposit)+"</div>"
    +"<div class=pay-status style=color:"+(c.depositPaid?"#10b981":"#d97706")+">"+(c.depositPaid?"✓ 已入帳":"⏳ 待入帳")+"</div></div>"
    +"<div class='pay-box "+(c.balancePaid?"paid":"pending")+"'><div class=pay-label>尾款 (70%)</div><div class=pay-amount>"+fmt(c.balance)+"</div>"
    +"<div class=pay-status style=color:"+(c.balancePaid?"#10b981":"#d97706")+">"+(c.balancePaid?"✓ 已入帳":"⏳ 待入帳")+"</div></div>"
    +"<div class=pay-box><div class=pay-label>合約總額</div><div class=pay-amount>"+fmt(c.amount)+"</div>"
    +"<div class=pay-status style=color:#64748b>含工料全額</div></div>"
    +"</div>"
    +"<div class=pay-label style=margin-bottom:6px>備注</div>"
    +"<div class=note-box>"+c.note+"</div>"
    +"</div>";
}

var P2KEY='leyan-dispatch-demo-v2', JOBS=[], DSEL=null, SEARCH='', RF='全部', SF='全部', CALREG='全部';

function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function localDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function localInput(d){return localDate(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function stamp(t){return new Date(t).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});}
function notify(msg){var old=document.querySelector('.p2-toast');if(old)old.remove();var el=document.createElement('div');el.className='p2-toast';el.setAttribute('role','status');el.textContent=msg;document.body.appendChild(el);setTimeout(function(){el.remove();},4000);}
function persist(){try{localStorage.setItem(P2KEY,JSON.stringify(JOBS));}catch(e){notify('瀏覽器無法儲存；本次變更只保留到重新整理前。');}DISPATCH=JOBS;}
function history(j,text){j.history=j.history||[];j.history.push({at:new Date().toISOString(),text:text});}
function initJobs(){try{var data=JSON.parse(localStorage.getItem(P2KEY));if(Array.isArray(data)&&data.every(function(j){return j.id&&j.client&&j.received&&Array.isArray(j.history);}))JOBS=data;}catch(e){}
 if(!JOBS.length){var now=new Date();JOBS=DISPATCH.slice(0,4).map(function(d,i){return {id:d.id,client:'示範客戶 '+(i+1),region:d.region,category:d.category,engineer:ENGINEERS[d.region+'|'+d.category],received:now.toISOString(),date:'',start:null,end:null,hours:2,buffer:30,urgent:i===0,status:'待派工',note:d.note,history:[{at:now.toISOString(),text:'建立示範報修'}]};});persist();}JOBS.forEach(function(j){var name=ENGINEERS[j.region+'|'+j.category];if(name)j.engineer=name;delete j.contact;delete j.phone;delete j.address;});persist();DISPATCH=JOBS;}

 document.getElementById('content').innerHTML='<div class="p2-head"><div><h2>報修派工</h2><div class="p2-sub">接單、排程、到場與再訪，集中追蹤。</div></div><button class="p2-btn" data-p2="new">＋ 新增報修</button></div><div class="p2-grid">'+['待派工','已派工','進行中','待料'].map(function(st){return '<div class="p2-stat"><b>'+JOBS.filter(function(j){return j.status===st;}).length+'</b><span>'+st+'</span></div>';}).join('')+'</div><div class="p2-note">示範規則：報修起算 72 小時內完成、週六不排工、只使用自有工程師。週日暫允許（待確認）。工作時段暫設 09:00–18:00；交通緩衝預設 30 分鐘。空檔僅依本頁示範工單計算，未讀取 Google 行事曆。</div><div class="p2-filters"><input aria-label="搜尋工單" id="p2-search" placeholder="搜尋客戶、工單或問題" value="'+esc(SEARCH)+'"><select id="p2-region" aria-label="地區">'+opts(['全部','雙北','桃竹'],RF)+'</select><select id="p2-status" aria-label="工單狀態">'+opts(['全部','待派工','已派工','進行中','待料','待再訪','已完成','已取消'],SF)+'</select><button class="p2-btn secondary" data-p2="calendar">查看排程</button></div><div class="card p2-table"><table><thead><tr><th>工單／客戶</th><th>區域／類別</th><th>工程師</th><th>預定到場</th><th>狀態</th></tr></thead><tbody>'+shown.map(function(j){return '<tr class="p2-row"><td><button style="text-align:left;padding:10px 0" data-job="'+esc(j.id)+'"><b>'+esc(j.client)+'</b><div class="p2-sub">'+esc(j.id)+(j.parent?' · 再訪 '+esc(j.parent):'')+(j.urgent?' · 急件':'')+'</div></button></td><td>'+esc(j.region)+'<br>'+esc(j.category)+'</td><td>'+esc(j.engineer)+'</td><td>'+(j.start?stamp(j.start):'尚未安排')+'</td><td>'+statusLabel(j)+'</td></tr>';}).join('')+'</tbody></table>'+(shown.length?'':'<div class="p2-empty">沒有符合的工單</div>')+'</div>'+(DSEL?jobPanel(JOBS.find(function(j){return j.id===DSEL;})):'');
 document.getElementById('p2-search').oninput=function(e){var pos=e.target.selectionStart;SEARCH=e.target.value;renderDispatch();var f=document.getElementById('p2-search');f.focus();f.setSelectionRange(pos,pos);};document.getElementById('p2-region').onchange=function(e){RF=e.target.value;renderDispatch();};document.getElementById('p2-status').onchange=function(e){SF=e.target.value;renderDispatch();};}
function jobPanel(j){if(!j)return '';var terminal=['已完成','已取消'].includes(j.status);return '<section class="card p2-panel" id="p2-detail"><div class="p2-head"><h3>'+esc(j.id)+' · '+esc(j.client)+'</h3><button data-p2="close">關閉詳情 ✕</button></div><p>'+esc(j.note)+'</p><p style="margin-top:12px">報修：'+stamp(j.received)+'　期限：'+stamp(new Date(new Date(j.received).getTime()+72*3600000))+'</p><p class="p2-sub">工時 '+j.hours+' 小時／交通緩衝 '+j.buffer+' 分鐘｜'+esc(j.engineer)+'</p><div class="p2-actions">'+(!terminal?'<button class="p2-btn" data-action="slots">'+(j.start?'重新排程':'查詢空檔／派工')+'</button>':'')+(j.status==='已派工'?'<button class="p2-btn secondary" data-action="start">開始處理</button>':'')+(j.status==='進行中'?'<button class="p2-btn secondary" data-action="wait">標記待料</button><button class="p2-btn" data-action="complete">確認完成</button>':'')+(['進行中','待料'].includes(j.status)?'<button class="p2-btn secondary" data-action="revisit">建立再訪單</button>':'')+(!terminal?'<button class="p2-btn secondary" data-action="cancel">取消工單</button>':'')+((j.start&&j.status!=='已取消')?'<button class="p2-btn secondary" data-job-calendar="'+esc(j.id)+'">在月曆查看</button>':'')+'</div><div id="p2-slotbox"></div><h4 style="margin-top:20px">處理紀錄</h4>'+(j.history||[]).map(function(h){return '<div class="p2-history">'+stamp(h.at)+'　'+esc(h.text)+'</div>';}).join('')+'<p class="p2-sub">派工只更新本機示範資料，不會通知客戶或工程師。</p></section>';}
function slots(j){var received=new Date(j.received),deadline=new Date(received.getTime()+72*3600000),now=new Date();var result=[];for(var day=0;day<5;day++){var base=new Date(now);base.setDate(base.getDate()+day);if(base.getDay()===6)continue;for(var hour=9;hour<=17;hour++){var a=new Date(base);a.setHours(hour,0,0,0);var end=new Date(a.getTime()+j.hours*3600000);if(a<now||a<received||end>deadline||end.getHours()>18||(end.getHours()===18&&end.getMinutes()>0))continue;var conflict=JOBS.some(function(k){if(k.id===j.id||k.engineer!==j.engineer||!k.start||['已取消','已完成','待再訪'].includes(k.status))return false;var pad=Math.max(Number(j.buffer),Number(k.buffer)||0)*60000;return a.getTime()<new Date(k.end).getTime()+pad&&end.getTime()+pad>new Date(k.start).getTime();});if(!conflict)result.push({start:a.toISOString(),end:end.toISOString()});}}return result;}
function showSlots(){var j=JOBS.find(function(x){return x.id===DSEL;}),list=slots(j);var box=document.getElementById('p2-slotbox');box.innerHTML=list.length?'<div class="p2-slots">'+list.map(function(k){return '<label class="p2-slot"><input type="radio" name="p2-slot" value="'+k.start+'"> '+stamp(k.start)+'–'+new Date(k.end).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false})+'</label>';}).join('')+'</div><button class="p2-btn" style="margin-top:12px" data-action="assign">確認派工（僅本機）</button>':'<div class="p2-note" style="margin-top:12px">三日內沒有符合條件的空檔。請與客戶協調並記錄，不會自動超期派工。</div><button class="p2-btn secondary" data-action="coordinate">記錄協調結果</button>';}
function newDialog(parent){var old=document.getElementById('p2-dialog');if(old)old.remove();var dialog=document.createElement('dialog');dialog.className='p2-dialog';dialog.id='p2-dialog';var j=parent||{};dialog.innerHTML='<h2>'+(parent?'建立再訪單':'新增報修')+'</h2><p class="p2-sub" style="margin-bottom:18px">示範資料請勿填寫真實個資。星號為必填。</p><form id="p2-form"><div class="p2-form"><label>客戶名稱 *<input name="client" required maxlength="80" value="'+esc(j.client||'')+'"></label><label>報修時間 *<input type="datetime-local" name="received" required value="'+localInput(new Date())+'"></label><label>地區 *<select name="region">'+opts(['雙北','桃竹'],j.region||'雙北')+'</select></label><label>類別 *<select name="category">'+opts(['弱電維護','硬體維護'],j.category||'弱電維護')+'</select></label><label class="p2-wide">自動對應工程師<input name="engineer" readonly></label><label>預估工時（小時）*<input name="hours" type="number" min="0.5" max="8" step="0.5" required value="'+(j.hours||2)+'"></label><label>交通緩衝（分鐘）*<input name="buffer" type="number" min="0" max="180" step="15" required value="'+(j.buffer==null?30:j.buffer)+'"></label><label class="p2-wide">問題／再訪原因 *<textarea name="note" rows="3" required maxlength="1000">'+(parent?'':esc(j.note||''))+'</textarea></label><label><span><input type="checkbox" name="urgent"> 急件（標示優先，仍須符合排程）</span></label></div><div class="p2-actions"><button class="p2-btn" type="submit">儲存並查詢空檔</button><button type="button" class="p2-btn secondary" data-p2="dialog-close">取消</button></div></form>';document.body.appendChild(dialog);var f=dialog.querySelector('form');function match(){f.elements.engineer.value=ENGINEERS[f.elements.region.value+'|'+f.elements.category.value];}f.elements.region.onchange=match;f.elements.category.onchange=match;match();f.onsubmit=function(e){e.preventDefault();var d=new FormData(f),received=new Date(d.get('received'));if(received>new Date()){notify('報修時間不能晚於現在。');return;}var n={id:'D'+Date.now().toString(36).toUpperCase(),client:d.get('client').trim(),region:d.get('region'),category:d.get('category'),engineer:f.elements.engineer.value,received:received.toISOString(),date:'',start:null,end:null,hours:Number(d.get('hours')),buffer:Number(d.get('buffer')),status:'待派工',urgent:d.has('urgent'),note:d.get('note').trim(),history:[]};if(!n.client||!n.note){notify('請完整填寫必填欄位。');return;}if(parent){n.parent=parent.id;parent.status='待再訪';history(parent,'建立再訪單 '+n.id);}history(n,parent?'由 '+parent.id+' 建立再訪報修':'建立報修');JOBS.unshift(n);persist();DSEL=n.id;RF=SF='全部';SEARCH='';dialog.close();go('dispatch');DSEL=n.id;renderDispatch();showSlots();notify('已儲存在此瀏覽器。');};dialog.showModal();}
function action(type){var j=JOBS.find(function(x){return x.id===DSEL;});if(!j)return;if(type==='slots'){showSlots();return;}if(type==='assign'){var picked=document.querySelector('[name="p2-slot"]:checked');if(!picked){notify('請先選擇到場時間。');return;}var valid=slots(j).find(function(k){return k.start===picked.value;});if(!valid){notify('空檔已變動，請重新查詢。');showSlots();return;}j.start=valid.start;j.end=valid.end;j.date=localDate(new Date(valid.start));j.status='已派工';history(j,'確認派工 '+stamp(j.start)+'，'+j.engineer+'（未發送通知）');}else if(type==='revisit'){newDialog(j);return;}else if(type==='coordinate'){var note=prompt('請輸入與客戶協調的結果（不會自動更改原期限）');if(!note||!note.trim())return;history(j,'協調紀錄：'+note.trim());}else if(type==='cancel'){var reason=prompt('請輸入取消原因');if(!reason||!reason.trim())return;j.status='已取消';history(j,'取消：'+reason.trim());}else if(type==='complete'){var result=prompt('請輸入完工／客戶確認紀錄');if(!result||!result.trim())return;j.status='已完成';history(j,'完工確認：'+result.trim());var parent=JOBS.find(function(k){return k.id===j.parent;});if(parent&&parent.status==='待再訪'){parent.status='已完成';history(parent,'再訪單 '+j.id+' 完成，原工單同步完成');}}else if(type==='start'){j.status='進行中';history(j,'工程師開始處理');}else if(type==='wait'){j.status='待料';history(j,'待料，需另建再訪單安排後續');}persist();renderDispatch();notify('工單已更新（僅本機）。');}

var CALMONTH=new Date(new Date().getFullYear(),new Date().getMonth(),1), CALDAY=localDate(new Date()), CALENGINEER='全部';
function hm(t){return new Date(t).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false});}
function calendarJobs(){return JOBS.filter(function(j){return j.start&&j.end&&!['已取消','待再訪','待派工'].includes(j.status)&&(CALREG==='全部'||j.region===CALREG)&&(CALENGINEER==='全部'||j.engineer===CALENGINEER);}).sort(function(a,b){return a.start.localeCompare(b.start);});}
function renderSchedule(){var jobs=calendarJobs(),year=CALMONTH.getFullYear(),month=CALMONTH.getMonth(),first=new Date(year,month,1),begin=new Date(year,month,1-first.getDay()),today=localDate(new Date());var visibleCount=jobs.filter(function(j){var d=new Date(j.start);return d.getFullYear()===year&&d.getMonth()===month;}).length;
var cells='';for(var i=0;i<42;i++){var day=new Date(begin);day.setDate(day.getDate()+i);var key=localDate(day),list=jobs.filter(function(j){return localDate(new Date(j.start))===key;});cells+='<div class="cal-day'+(day.getMonth()!==month?' other-month':'')+(day.getDay()===6?' saturday':'')+(key===CALDAY?' selected':'')+'" data-date="'+key+'"><button class="cal-date'+(key===today?' today':'')+'" data-cal-date="'+key+'" aria-label="'+key+'，'+list.length+' 件派工"'+(key===today?' aria-current="date"':'')+'>'+day.getDate()+'</button>'+list.map(function(j){return '<button class="cal-event'+(j.region==='桃竹'?' region-peach':'')+(j.status==='已完成'?' finished':'')+'" data-job="'+esc(j.id)+'" aria-label="'+esc(hm(j.start)+'至'+hm(j.end)+' '+j.engineer+' '+j.client+' '+j.status)+'" title="'+esc(j.engineer+'｜'+j.client+'｜'+j.status)+'"><span class="cal-time">'+hm(j.start)+'–'+hm(j.end)+'</span><span>'+esc(j.engineer)+'</span><span class="cal-customer">'+esc(j.client)+'</span></button>';}).join('')+'</div>';}
var selected=jobs.filter(function(j){return localDate(new Date(j.start))===CALDAY;});document.getElementById('content').innerHTML='<div class="p2-head"><div><h2>派工行事曆</h2><p class="p2-sub">確認派工後自動顯示，未安排的日期留白。點日期看當日明細，點派工開啟工單。</p></div><button class="p2-btn" data-p2="dispatch">安排派工 →</button></div><div class="cal-controls"><h3 class="cal-heading">'+year+' 年 '+(month+1)+' 月</h3><button data-cal-move="-1" aria-label="上個月">‹</button><button data-cal-today>今天</button><button data-cal-move="1" aria-label="下個月">›</button><select id="p2-calreg" aria-label="排程地區">'+opts(['全部','雙北','桃竹'],CALREG)+'</select><select id="cal-engineer" aria-label="排程工程師">'+opts(['全部'].concat(Object.values(ENGINEERS)),CALENGINEER)+'</select></div><div class="cal-shell"><div class="cal-week">'+['日','一','二','三','四','五','六'].map(function(d){return '<span>'+d+'</span>';}).join('')+'</div><div class="cal-grid">'+cells+'</div></div><div class="cal-legend"><span><i></i>雙北</span><span><i class="peach"></i>桃竹</span><span>灰色：已完成</span><span>本月 '+visibleCount+' 件</span><span>週六不安排派工</span></div><section class="card cal-selected"><h3>'+esc(CALDAY.replace(/-/g,' / '))+' · '+selected.length+' 件派工</h3>'+(selected.length?selected.map(function(j){return '<div class="cal-agenda-item"><div><b>'+hm(j.start)+'–'+hm(j.end)+'　'+esc(j.engineer)+'</b><div class="p2-sub">'+esc(j.client)+' · '+esc(j.region)+'／'+esc(j.category)+' · '+esc(j.status)+'</div></div><button class="p2-btn secondary" data-job="'+esc(j.id)+'">查看工單</button></div>';}).join(''):'<p class="cal-empty">當日尚無安排派工</p>')+'</section><p class="p2-sub" style="margin-top:14px">僅顯示此瀏覽器已確認的派工；新增待派工不會先占用月曆。取消即移除，重新安排會移至新時段。未串接 Google 行事曆。</p>';
document.getElementById('p2-calreg').onchange=function(e){CALREG=e.target.value;renderSchedule();};document.getElementById('cal-engineer').onchange=function(e){CALENGINEER=e.target.value;renderSchedule();};}
document.addEventListener('click',function(e){var move=e.target.closest('[data-cal-move]');if(move){CALMONTH=new Date(CALMONTH.getFullYear(),CALMONTH.getMonth()+Number(move.dataset.calMove),1);CALDAY=localDate(CALMONTH);renderSchedule();return;}if(e.target.closest('[data-cal-today]')){var now=new Date();CALMONTH=new Date(now.getFullYear(),now.getMonth(),1);CALDAY=localDate(now);renderSchedule();return;}var day=e.target.closest('[data-cal-date]');if(day){CALDAY=day.dataset.calDate;renderSchedule();return;}var show=e.target.closest('[data-job-calendar]');if(show){var j=JOBS.find(function(k){return k.id===show.dataset.jobCalendar;});if(!j||!j.start)return;var d=new Date(j.start);CALMONTH=new Date(d.getFullYear(),d.getMonth(),1);CALDAY=localDate(d);CALREG=CALENGINEER='全部';go('calendar');}});

document.addEventListener('click',function(e){var job=e.target.closest('[data-job]');if(job){go('dispatch');DSEL=job.dataset.job;renderDispatch();document.getElementById('p2-detail').scrollIntoView({block:'start'});return;}var a=e.target.closest('[data-action]');if(a){action(a.dataset.action);return;}var p=e.target.closest('[data-p2]');if(!p)return;var type=p.dataset.p2;if(type==='new')newDialog();else if(type==='close'){DSEL=null;renderDispatch();}else if(type==='dialog-close')document.getElementById('p2-dialog').close();else if(type==='calendar')go('calendar');else if(type==='dispatch')go('dispatch');});
initJobs();

// ── INIT ─────────────────────────────────────────────────────────────
document.getElementById("todayDate").textContent=
  new Date().toLocaleDateString("zh-TW",{month:"numeric",day:"numeric",weekday:"short"});
go("dashboard");
})();
